<ion-header><ion-toolbar color="primary"><ion-title>Nail Studio 💅</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding"><div class="login-wrapper">
<h1>{{registerMode?'Crea tu cuenta':'Bienvenida a Nail Studio'}}</h1><p>Tu momento de belleza empieza aquí.</p>
<form (ngSubmit)="submit()">
<ion-item *ngIf="registerMode"><ion-input label="Nombre completo" label-placement="stacked" [(ngModel)]="name" name="name" required></ion-input></ion-item>
<ion-item *ngIf="registerMode"><ion-input label="Teléfono" label-placement="stacked" [(ngModel)]="phone" name="phone" type="tel"></ion-input></ion-item>
<ion-item><ion-input label="Correo electrónico" label-placement="stacked" type="email" [(ngModel)]="email" name="email" required></ion-input></ion-item>
<ion-item><ion-input label="Contraseña (8 caracteres mínimo)" label-placement="stacked" type="password" [(ngModel)]="password" name="password" required></ion-input></ion-item>
<ion-button expand="block" type="submit" [disabled]="busy">{{registerMode?'Registrarme':'Iniciar sesión'}}</ion-button></form>
<ion-button fill="clear" expand="block" (click)="registerMode=!registerMode">{{registerMode?'Ya tengo cuenta':'Crear una cuenta nueva'}}</ion-button>
<p class="ion-text-center">Para usar las citas, inicia el servidor PHP y MySQL.</p>
</div></ion-content>
