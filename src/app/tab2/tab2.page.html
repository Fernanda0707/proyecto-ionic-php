<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Registro - Paso {{ currentStep + 1 }} de {{ steps.length }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Indicador de Pasos -->
  <div class="step-indicator">
    <span 
      *ngFor="let step of steps; let i = index" 
      [class.active]="i === currentStep"
      [class.completed]="i < currentStep">
      {{ i + 1 }}
    </span>
  </div>
  <h2 class="step-title">{{ steps[currentStep] }}</h2>

  <!-- Paso 0: Account Setup -->
  <div *ngIf="currentStep === 0">
    <ion-item>
      <ion-input label="Correo Electrónico" labelPlacement="floating" type="email" [(ngModel)]="formData.email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="formData.pass"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Confirmar Contraseña" labelPlacement="floating" type="password" [(ngModel)]="formData.cpass"></ion-input>
    </ion-item>
  </div>

  <!-- Paso 1: Social Profiles -->
  <div *ngIf="currentStep === 1">
    <ion-item>
      <ion-input label="Twitter" labelPlacement="floating" [(ngModel)]="formData.twitter"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Facebook" labelPlacement="floating" [(ngModel)]="formData.facebook"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Google+" labelPlacement="floating" [(ngModel)]="formData.gplus"></ion-input>
    </ion-item>
  </div>

  <!-- Paso 2: Personal Details -->
  <div *ngIf="currentStep === 2">
    <ion-item>
      <ion-input label="Nombre" labelPlacement="floating" [(ngModel)]="formData.fname"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Apellido" labelPlacement="floating" [(ngModel)]="formData.lname"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Teléfono" labelPlacement="floating" type="tel" [(ngModel)]="formData.phone"></ion-input>
    </ion-item>
    <ion-item>
      <ion-textarea label="Dirección" labelPlacement="floating" [(ngModel)]="formData.address"></ion-textarea>
    </ion-item>
  </div>

  <!-- Paso 3: Módulo Multimedia (Fotos / Galería) -->
  <div *ngIf="currentStep === 3">
    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="camera-outline"></ion-icon> Adjuntar Fotografía / Evidencia
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item class="ion-margin-bottom">
          <ion-input 
            label="Descripción de la foto" 
            labelPlacement="floating" 
            placeholder="Ej: Credencial / Perfil" 
            [(ngModel)]="tituloFotoTemp">
          </ion-input>
        </ion-item>

        <input 
          type="file" 
          #fileInput 
          accept="image/*" 
          capture="environment" 
          style="display: none;" 
          (change)="onFileSelected($event)">

        <ion-button expand="block" color="success" (click)="fileInput.click()">
          <ion-icon slot="start" name="camera-outline"></ion-icon>
          Subir Fotografía / Tomar Foto
        </ion-button>
      </ion-card-content>
    </ion-card>

    <!-- Previsualización de imágenes subidas -->
    <div *ngIf="fotoService.fotos.length > 0" class="ion-margin-top">
      <h3>Fotos Adjuntas ({{ fotoService.fotos.length }})</h3>
      <ion-grid>
        <ion-row>
          <ion-col size="12" size-sm="6" *ngFor="let foto of fotoService.fotos; let i = index">
            <ion-card class="photo-card">
              <ion-img [src]="foto.webviewPath"></ion-img>
              <ion-card-header>
                <ion-card-title class="photo-title">{{ foto.titulo }}</ion-card-title>
              </ion-card-header>
              <ion-card-content>
                <ion-button expand="block" color="danger" fill="clear" (click)="fotoService.eliminarFoto(i)">
                  <ion-icon slot="start" name="trash-outline"></ion-icon>
                  Eliminar
                </ion-button>
              </ion-card-content>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </div>

  <!-- Botones de Navegación -->
  <div class="navigation-buttons ion-margin-top">
    <ion-button color="medium" (click)="previousStep()" [disabled]="currentStep === 0">
      Anterior
    </ion-button>

    <ion-button color="primary" (click)="nextStep()" *ngIf="currentStep < steps.length - 1">
      Siguiente
    </ion-button>

    <ion-button color="success" (click)="submitForm()" *ngIf="currentStep === steps.length - 1">
      <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
      Enviar Todo
    </ion-button>
  </div>
</ion-content>
